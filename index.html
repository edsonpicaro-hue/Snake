<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --text:#e2e8f0; --accent:#22c55e; --food:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:12px; background:var(--bg); color:var(--text);
         font-family:system-ui, sans-serif; user-select:none; }
  h1 { margin:0; letter-spacing:.2em; color:var(--accent); }
  .hud { display:flex; gap:24px; font-size:1.1rem; }
  .wrap { position:relative; }
  canvas { background:var(--panel); border:3px solid var(--accent); border-radius:8px;
           width:min(92vw, 480px); height:min(92vw, 480px); display:block; touch-action:none; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
             justify-content:center; gap:8px; background:rgba(15,23,42,.8); border-radius:8px;
             text-align:center; padding:16px; }
  .overlay.hidden { display:none; }
  .overlay h2 { margin:0; font-size:1.6rem; }
  button { background:var(--accent); color:#052e16; border:0; border-radius:6px; padding:8px 18px;
           font-size:1rem; font-weight:700; cursor:pointer; }
  small { opacity:.7; }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div class="hud">
    <span>Pontos: <b id="score">0</b></span>
    <span>Recorde: <b id="best">0</b></span>
  </div>
  <div class="wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="title">Snake</h2>
      <p id="msg">Use as setas ou WASD para mover.</p>
      <button id="start">Jogar</button>
      <small>Maçã +1 &middot; Mamão +2 (a cobra encolhe 3 casas deixando 3 cocôs, que viram um novo mamão após 5 maçãs). Comer cocô = fim de jogo, e encolher até sumir também!</small>
      <small>Espaço: pausar &middot; Enter: jogar/reiniciar</small>
    </div>
  </div>
<script>
(() => {
  const SIZE = 480, CELLS = 20, CELL = SIZE / CELLS;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best'), overlay = $('overlay');

  let best = 0;
  try { best = +localStorage.getItem('snake-best') || 0; } catch (e) {}
  bestEl.textContent = best;

  let snake, dir, nextDir, food, papaya = null, poops = [], poopQueue = 0, poopLeft = null, score, timer, steps = 0, state = 'idle'; // idle | running | paused | over

  const DIRS = {
    ArrowUp:[0,-1], w:[0,-1], W:[0,-1],
    ArrowDown:[0,1], s:[0,1], S:[0,1],
    ArrowLeft:[-1,0], a:[-1,0], A:[-1,0],
    ArrowRight:[1,0], d:[1,0], D:[1,0],
  };

  function reset() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = nextDir = [1,0];
    score = 0; steps = 0; scoreEl.textContent = 0;
    food = null; papaya = null; poops = []; poopQueue = 0; poopLeft = null;
    placeFood();
    spawnPapaya();
  }

  // sorteia uma casa livre (sem cobra, maçã, mamão ou cocô)
  function randomFree() {
    const taken = new Set(snake.map(s => s.x + ',' + s.y));
    if (food) taken.add(food.x + ',' + food.y);
    if (papaya) taken.add(papaya.x + ',' + papaya.y);
    poops.forEach(p => taken.add(p.x + ',' + p.y));
    const free = [];
    for (let x = 0; x < CELLS; x++)
      for (let y = 0; y < CELLS; y++)
        if (!taken.has(x + ',' + y)) free.push({ x, y });
    return free.length ? free[Math.floor(Math.random()*free.length)] : null;
  }

  function placeFood() { food = null; food = randomFree(); }

  // só existe um mamão por vez: ele só volta quando os cocôs viram mamão
  function spawnPapaya() { papaya = randomFree(); }

  // quando as maçãs acabam, todos os cocôs viram UM mamão (num dos cocôs que
  // não esteja sob a cobra; se todos estiverem, espera)
  function ripenPoops() {
    if (poopLeft === null || poopLeft > 0 || poopQueue > 0) return;
    const spot = poops.find(p => !snake.some(s => s.x === p.x && s.y === p.y));
    if (poops.length && !spot) return;
    poops = []; poopLeft = null;
    papaya = spot ? { x: spot.x, y: spot.y } : randomFree();
  }

  function interval() { return Math.max(65, 140 - score * 3); }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(tick, interval());
  }

  function start() {
    reset();
    state = 'running';
    overlay.classList.add('hidden');
    draw();
    schedule();
  }

  function showOverlay(title, msg, btn) {
    $('title').textContent = title;
    $('msg').textContent = msg;
    $('start').textContent = btn;
    overlay.classList.remove('hidden');
  }

  function gameOver(reason) {
    state = 'over';
    clearTimeout(timer);
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch (e) {}
    }
    showOverlay('Fim de jogo', (reason ? reason + ' ' : '') + 'Pontos: ' + score, 'Jogar de novo');
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused'; clearTimeout(timer);
      showOverlay('Pausado', 'Pressione espaço para continuar.', 'Continuar');
    } else if (state === 'paused') {
      state = 'running'; overlay.classList.add('hidden'); schedule();
    }
  }

  function tick() {
    if (state !== 'running') return;
    dir = nextDir;
    const head = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };
    const eating = !!food && head.x === food.x && head.y === food.y;
    // a cauda sai da casa neste passo, a menos que esteja comendo
    // casas da cauda que saem neste passo (2 quando a cobra faz cocô e encolhe)
    const shrinking = !eating && poopQueue > 0 && snake.length > 1;
    const body = eating ? snake : snake.slice(0, shrinking ? -2 : -1);
    if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS ||
        body.some(s => s.x === head.x && s.y === head.y) ||
        poops.some(p => p.x === head.x && p.y === head.y)) {  // comeu cocô
      draw(); return gameOver();
    }
    steps++;
    snake.unshift(head);
    const eatPapaya = !!papaya && head.x === papaya.x && head.y === papaya.y;
    if (eating) {
      score++; scoreEl.textContent = score;
      if (snake.length === CELLS * CELLS) { draw(); return gameOver(); }
      placeFood();
      if (poopLeft > 0) poopLeft--;     // mais uma maçã comida
    } else {
      let spot = snake.pop();
      // cada cocô encolhe a cobra uma casa e fica onde a cauda estava;
      // se só restar a cabeça, não há mais o que encolher e a cobra morre
      if (poopQueue > 0) {
        if (snake.length <= 1) { draw(); return gameOver('A cobra encolheu até sumir.'); }
        spot = snake.pop();
        if (!poops.some(p => p.x === spot.x && p.y === spot.y))
          poops.push({ x: spot.x, y: spot.y });
        poopQueue--;
      }
    }
    if (eatPapaya) {
      papaya = null;                    // o próximo mamão só vem dos cocôs
      score += 2; scoreEl.textContent = score;
      poopQueue = 3; poopLeft = 5;
    }
    ripenPoops();
    draw();
    schedule();
  }

  function turn(d) {
    if (state !== 'running') return;
    // impede inverter 180 graus
    if (d[0] === -dir[0] && d[1] === -dir[1]) return;
    nextDir = d;
  }

  function drawPapaya(p) {
    const s = CELL/24;
    ctx.save();
    ctx.translate(p.x*CELL + CELL/2, p.y*CELL + CELL/2);
    ctx.rotate(0.6);
    const g = ctx.createLinearGradient(0, -11*s, 0, 11*s);
    g.addColorStop(0, '#fdba74');
    g.addColorStop(0.5, '#f97316');
    g.addColorStop(1, '#c2410c');
    ctx.fillStyle = g;
    ctx.strokeStyle = '#9a3412';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 1*s, 6.5*s, 10*s, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.beginPath();
    ctx.ellipse(-2.5*s, -2*s, 1.6*s, 4*s, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#15803d';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -9*s); ctx.lineTo(0.5*s, -12*s);
    ctx.stroke();
    ctx.restore();
  }

  function drawPoop(p) {
    const s = CELL/24, x = p.x*CELL + CELL/2, y = p.y*CELL + CELL/2;
    ctx.fillStyle = '#92400e';
    ctx.strokeStyle = '#451a03';
    ctx.lineWidth = 1.5;
    for (const [dy, rx, ry] of [[6, 9, 5], [1, 7, 4.5], [-4, 4.5, 4]]) {
      ctx.beginPath();
      ctx.ellipse(x, y + dy*s, rx*s, ry*s, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.beginPath();
    ctx.ellipse(x - 3*s, y - 5*s, 1.2*s, 1.8*s, 0, 0, Math.PI*2);
    ctx.fill();
    if (poopLeft > 0) {             // maçãs que faltam para virar mamão
      ctx.font = 'bold ' + 11*s + 'px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#451a03';
      ctx.strokeText(poopLeft, x, y + 4*s);
      ctx.fillStyle = '#fff';
      ctx.fillText(poopLeft, x, y + 4*s);
    }
  }

  function drawApple() {
    if (!food) return;
    const x = food.x*CELL + CELL/2, y = food.y*CELL + CELL/2 + 1, r = CELL*0.4;
    const g = ctx.createRadialGradient(x - r*0.4, y - r*0.4, 1, x, y, r*1.4);
    g.addColorStop(0, '#f87171');
    g.addColorStop(0.55, '#dc2626');
    g.addColorStop(1, '#7f1d1d');
    ctx.fillStyle = g;
    // dois lóbulos formam o formato de maçã
    for (const dx of [-0.32, 0.32]) {
      ctx.beginPath();
      ctx.arc(x + dx*r, y, r*0.78, 0, Math.PI*2);
      ctx.fill();
    }
    // brilho
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath();
    ctx.ellipse(x - r*0.5, y - r*0.3, r*0.16, r*0.28, -0.5, 0, Math.PI*2);
    ctx.fill();
    // cabinho
    ctx.strokeStyle = '#78350f';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y - r*0.55);
    ctx.quadraticCurveTo(x, y - r*0.95, x + 2, y - r*1.15);
    ctx.stroke();
    // folha
    ctx.fillStyle = '#4ade80';
    ctx.beginPath();
    ctx.ellipse(x + r*0.6, y - r*0.95, r*0.42, r*0.2, -0.5, 0, Math.PI*2);
    ctx.fill();
  }

  function drawSnake() {
    const P = snake.map(s => ({ x: s.x*CELL + CELL/2, y: s.y*CELL + CELL/2 }));
    const n = P.length, base = CELL*0.8;
    // corpo afina em direção à cauda
    const widthAt = i => base * (0.4 + 0.6*Math.min(1, (n - 1 - i) / 5));
    ctx.lineCap = ctx.lineJoin = 'round';

    const pass = (color, extra, scale) => {
      ctx.strokeStyle = color;
      for (let i = n - 1; i > 0; i--) {
        ctx.lineWidth = Math.max(2, (widthAt(i) + widthAt(i - 1))/2*scale + extra);
        ctx.beginPath();
        ctx.moveTo(P[i].x, P[i].y);
        ctx.lineTo(P[i - 1].x, P[i - 1].y);
        ctx.stroke();
      }
    };
    pass('#14532d', 3, 1);      // contorno
    pass('#22c55e', 0, 1);      // corpo
    pass('rgba(187,247,208,.35)', 0, 0.35); // faixa de luz no dorso

    // manchas no dorso
    ctx.fillStyle = '#15803d';
    for (let i = 2; i < n - 1; i += 2) {
      ctx.beginPath();
      ctx.arc(P[i].x, P[i].y, widthAt(i)*0.17, 0, Math.PI*2);
      ctx.fill();
    }

    // cabeça, girada conforme a direção
    ctx.save();
    ctx.translate(P[0].x, P[0].y);
    ctx.rotate(Math.atan2(dir[1], dir[0]));
    if (Math.floor(steps/2) % 2 === 0) {      // língua pisca
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(CELL*0.5, 0); ctx.lineTo(CELL*0.85, 0);
      ctx.lineTo(CELL*0.98, -CELL*0.1);
      ctx.moveTo(CELL*0.85, 0); ctx.lineTo(CELL*0.98, CELL*0.1);
      ctx.stroke();
    }
    ctx.fillStyle = '#16a34a';
    ctx.strokeStyle = '#14532d';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(CELL*0.08, 0, CELL*0.54, CELL*0.44, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    for (const side of [-1, 1]) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(CELL*0.17, side*CELL*0.23, CELL*0.14, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(CELL*0.21, side*CELL*0.23, CELL*0.07, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function draw() {
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.fillStyle = 'rgba(255,255,255,.03)';
    for (let x = 0; x < CELLS; x++)
      for (let y = 0; y < CELLS; y++)
        if ((x + y) % 2) ctx.fillRect(x*CELL, y*CELL, CELL, CELL);

    poops.forEach(drawPoop);
    if (papaya) drawPapaya(papaya);
    drawApple();
    drawSnake();
  }

  document.addEventListener('keydown', e => {
    if (DIRS[e.key]) { e.preventDefault(); turn(DIRS[e.key]); return; }
    if (e.key === ' ') { e.preventDefault(); togglePause(); }
    else if (e.key === 'Enter' && (state === 'idle' || state === 'over')) start();
  });

  $('start').addEventListener('click', () => {
    if (state === 'paused') togglePause(); else start();
  });

  // controle por deslizar o dedo
  let t0 = null;
  canvas.addEventListener('touchstart', e => { t0 = e.touches[0]; }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!t0) return;
    const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 20)
      turn(Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]);
    t0 = null;
  });

  reset(); draw();
})();
</script>
</body>
</html>
